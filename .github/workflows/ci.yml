name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Format ────────────────────────────────────────────────────────────────────
  # Fast source formatting check. Required on every PR and push.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        run: sh ./scripts/install-zig.sh 0.16.0

      - name: Check formatting
        run: zig fmt --check build.zig src/ tests/

  # ── Lint ──────────────────────────────────────────────────────────────────────
  # Workflow syntax and shell script linting.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Run shellcheck
        run: find scripts/ packaging/ tests/vectors/pki -name "*.sh" -exec shellcheck {} +

      # #256-G review: the rest of benchmarks/ is not swept here yet (several
      # pre-existing scripts have their own unrelated shellcheck findings);
      # this scans exactly the H3 benchmark harness this PR added/changed, so
      # regressions in it get PR-level signal instead of none.
      - name: Run shellcheck on the H3 benchmark harness (#256-G)
        run: >-
          shellcheck
          benchmarks/run.sh
          benchmarks/competitive/run.sh
          benchmarks/competitive/netem-impair.sh
          benchmarks/test-h3-benchmark.sh

  # ── TLS dependency audit ──────────────────────────────────────────────────────
  # Enforces the external-library policy (#379): forbidden TLS/crypto/QUIC/H3
  # dependency names must not be configured, OpenSSL must stay behind the
  # adapter boundary, native paths must be @cImport-free, and produced
  # appliance/general artifacts must have the expected linkage. This is a
  # required v0.5 release gate for the Bare Systems appliance (#391).
  dependency-audit:
    name: TLS dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Source and configuration audit
        run: ./scripts/audit-dependencies.sh

      - name: Install system dependencies (general profile)
        run: sudo apt-get install -y libssl-dev

      - name: Install Zig
        run: sh ./scripts/install-zig.sh 0.16.0

      - name: Build appliance profile (no OpenSSL)
        run: zig build -Doptimize=ReleaseFast -Dtls-profile=appliance

      - name: Audit appliance artifact linkage
        run: |
          ./scripts/audit-release-binary.sh \
            --binary zig-out/bin/tardi \
            --profile appliance \
            --output "$RUNNER_TEMP/dependency-inventory-appliance.json"

      - name: Build general profile (OpenSSL adapter)
        run: zig build -Doptimize=ReleaseFast -Dtls-profile=general

      - name: Audit general artifact linkage
        run: |
          ./scripts/audit-release-binary.sh \
            --binary zig-out/bin/tardi \
            --profile general \
            --output "$RUNNER_TEMP/dependency-inventory-general.json"

      - name: Upload dependency inventories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-inventory
          path: ${{ runner.temp }}/dependency-inventory-*.json
          if-no-files-found: error
          retention-days: 14

  # ── Unit tests ────────────────────────────────────────────────────────────────
  # Runs unit tests across platforms. Required on every PR and push.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libssl-dev

      - name: Install Zig
        run: sh ./scripts/install-zig.sh 0.16.0

      - name: Cache Zig build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-${{ github.sha }}
          restore-keys: |
            zig-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-
            zig-test-${{ runner.os }}-${{ runner.arch }}-

      - name: Print Zig version
        run: zig version

      - name: Run unit tests
        run: zig build test --summary all --error-style verbose

      # #162: `tardi init <profile>` / `config init --profile` real
      # generated-config validation, on the default/general (OpenSSL-adapter)
      # profile this job otherwise never runs `check` against -- the
      # appliance-profile job below covers the native-profile equivalent.
      # One Linux leg of the matrix is enough; no need to multiply this
      # across every OS the `test` job builds for.
      - name: Run tardi init <profile> real generated-config validation (general profile)
        if: matrix.os == 'ubuntu-latest'
        run: zig build test-integration-init --summary all --error-style verbose

  # ── Appliance profile tests ──────────────────────────────────────────────────
  # The default `test` job above only exercises the general (OpenSSL-adapter)
  # profile: `requireNativeTlsProfile()` skips every native-listener/appliance
  # test under it. This job runs the appliance (`-Dtls-profile=appliance`)
  # profile's own unit suite plus the native-listener and full integration
  # suites, so appliance credential/TLS regressions (#392) are caught before
  # merge, not only discovered by a separate manual run.
  test-appliance:
    name: Test appliance profile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y openssl

      - name: Install Zig
        run: sh ./scripts/install-zig.sh 0.16.0

      - name: Cache Zig build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-test-appliance-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-${{ github.sha }}
          restore-keys: |
            zig-test-appliance-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-
            zig-test-appliance-${{ runner.os }}-${{ runner.arch }}-

      - name: Print Zig version
        run: zig version

      - name: Run appliance profile unit tests
        run: zig build test -Dtls-profile=appliance --summary all --error-style verbose

      - name: Run native TLS listener integration tests
        run: zig build test-integration-native-tls -Dtls-profile=appliance --summary all --error-style verbose

      # The full integration suite includes timing-sensitive assertions (e.g.
      # graceful-shutdown-under-load bounds) that this repo's pre-existing
      # `integration-tests` job below already scopes to Linux only, to avoid
      # macOS GitHub Actions runners' higher scheduling variance. Match that
      # precedent here rather than gating this PR-blocking job on a class of
      # flakiness the project has already chosen not to block merges on.
      - name: Run full integration suite (appliance profile)
        if: runner.os == 'Linux'
        run: zig build test-integration -Dtls-profile=appliance --summary all --error-style verbose

      # #369 stable smoke subset: external OpenSSL interop, real process
      # restart, and a short reconnect soak. The `interop.`/`restart.`/
      # `soak.`-filtered tests it runs already live in the same
      # tests/integration.zig file the unfiltered "Run full integration
      # suite" step above executes on Linux, so running this step there
      # too would just repeat them for no benefit; this step exists
      # specifically to give macOS (which the full suite deliberately
      # skips for scheduling-variance reasons -- see the comment above)
      # the coverage that Linux already gets from the full suite. The
      # heavier soak/restart-loop variant runs on its own schedule (see
      # resumption-soak.yml) rather than blocking PRs.
      - name: Run resumption/0-RTT interop, restart, and soak smoke suite
        if: runner.os != 'Linux'
        run: zig build test-integration-resumption-interop -Dtls-profile=appliance --summary all --error-style verbose

      # Resumable OpenSSL session files (and the generated alternate
      # credential's private key) belong under $TMPDIR, never under the
      # cached .zig-cache tree -- this is a cheap invariant check for that,
      # independent of whether the test suite's own best-effort per-file
      # cleanup ran on every exit path. Runs on every OS: Linux exercises
      # these tests via the full suite above, macOS via the filtered step
      # above.
      - name: Verify no OpenSSL interop secrets leaked into the Zig cache
        run: |
          leaked=$(find .zig-cache -iname 'interop-*.sess' -o -iname 'interop-restart-key-*.pem' -o -iname 'interop-*-ticket-keys.json' 2>/dev/null)
          if [ -n "$leaked" ]; then
            echo "found leaked interop secret file(s) under .zig-cache:"
            echo "$leaked"
            exit 1
          fi

  # ── PKI differential corpus ──────────────────────────────────────────────────
  # Replays the bounded core corpus against the pure-Zig validator, OpenSSL,
  # and Go crypto/x509. External validators remain out of process.
  pki-differential:
    name: PKI differential (core)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenSSL
        run: sudo apt-get install -y openssl

      - name: Install Zig
        run: sh ./scripts/install-zig.sh 0.16.0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Print validator versions
        run: |
          zig version
          openssl version
          go version

      - name: Verify deterministic PKI fixtures
        run: |
          tests/vectors/pki/generate.sh
          git diff --exit-code -- tests/vectors/pki

      - name: Run stable differential corpus
        env:
          TARDIGRADE_PKI_DIFF_ARTIFACT_DIR: pki-differential-artifacts
        run: >-
          zig build test-pki-differential
          --summary all --error-style verbose --test-timeout 2m

      - name: Upload differential mismatch artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pki-differential-core-mismatches
          path: |
            pki-differential-artifacts/*.json
            pki-differential-artifacts/*.reduced.der
            pki-differential-artifacts/*.reduced*.crt
          if-no-files-found: ignore
          retention-days: 14

  # ── Example config validation ─────────────────────────────────────────────────
  # Checks that all configs in the examples/ directory parse successfully.
  # Ensures that parser changes do not silently break the curated examples.
  examples:
    name: Validate example configs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: sudo apt-get install -y libssl-dev

      - name: Install Zig
        run: sh ./scripts/install-zig.sh 0.16.0

      - name: Cache Zig build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-examples-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-${{ github.sha }}
          restore-keys: |
            zig-examples-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-
            zig-examples-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Tardigrade
        run: zig build

      - name: Validate example configs
        run: ./scripts/validate-examples.sh

  # ── Build validation ──────────────────────────────────────────────────────────
  # Validates Debug, ReleaseSafe, and ReleaseFast builds across platforms.
  # Debug catches assertion failures; ReleaseSafe catches safety-check panics;
  # ReleaseFast confirms production artifact parity.
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
        optimize: [Debug, ReleaseSafe, ReleaseFast]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libssl-dev

      - name: Install Zig
        run: sh ./scripts/install-zig.sh 0.16.0

      - name: Cache Zig build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-build-${{ matrix.optimize }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-${{ github.sha }}
          restore-keys: |
            zig-build-${{ matrix.optimize }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-
            zig-build-${{ matrix.optimize }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Print Zig version
        run: zig version

      - name: Build (${{ matrix.optimize }})
        env:
          OPTIMIZE: ${{ matrix.optimize }}
        run: zig build "-Doptimize=$OPTIMIZE"

  # ── Packaging smoke ─────────────────────────────────────────────────────────
  # Verifies the release archive layout, install script behavior, host-native
  # DEB/RPM package layout, and the local-build Docker image, each against a
  # disposable container.
  packaging-smoke:
    name: Packaging smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: sudo apt-get install -y libssl-dev

      - name: Install Zig
        run: sh ./scripts/install-zig.sh 0.16.0

      - name: Cache Zig build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-packaging-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-${{ github.sha }}
          restore-keys: |
            zig-packaging-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-
            zig-packaging-${{ runner.os }}-${{ runner.arch }}-

      - name: Build ReleaseFast binary
        run: zig build -Doptimize=ReleaseFast

      - name: Smoke test install script
        run: ./scripts/test-install.sh

      - name: Smoke test DEB package
        run: ./scripts/test-deb-package.sh

      - name: Smoke test RPM package
        run: ./scripts/test-rpm-package.sh

      - name: Smoke test Docker image
        run: ./scripts/test-docker-image.sh

  # ── Performance smoke ────────────────────────────────────────────────────────
  # Shared-runner loopback benchmark with conservative floors and a 30s default
  # run per scenario. This is not a release benchmark; it exists only to catch
  # obvious regressions without making PRs noisy or flaky.
  perf-smoke:
    name: Perf smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get install -y libssl-dev wrk

      - name: Install Zig
        run: sh ./scripts/install-zig.sh 0.16.0

      - name: Cache Zig build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-perf-smoke-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-${{ github.sha }}
          restore-keys: |
            zig-perf-smoke-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-
            zig-perf-smoke-${{ runner.os }}-${{ runner.arch }}-

      - name: Build ReleaseFast binary
        run: zig build -Doptimize=ReleaseFast

      - name: Run performance smoke benchmark
        run: ./benchmarks/ci-smoke.sh --save benchmarks/results/ci-smoke.json

      # #256-G review: this stubs h2load/tc/tardigrade throughout — no real
      # server, no real network — so it's cheap and appropriate for bounded
      # PR CI, giving the H3 benchmark harness itself (as opposed to a live
      # H3 run, which stays manual/scheduled) real PR-level regression
      # coverage.
      - name: Run H3 benchmark harness tests (#256-G)
        run: ./benchmarks/test-h3-benchmark.sh

      - name: Stage perf smoke artifact
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/perf-artifacts"
          cp benchmarks/results/ci-smoke.json "$RUNNER_TEMP/perf-artifacts/ci-smoke.json"

      - name: Upload perf smoke results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-smoke-results
          path: ${{ runner.temp }}/perf-artifacts/ci-smoke.json
          if-no-files-found: error
          retention-days: 7

  # ── Crypto benchmark trend ────────────────────────────────────────────────────
  # Reduced CI/trend profile for #378: reports CryptoProvider/record/
  # ticket-protection measurements as a diffable JSON artifact. Correctness for
  # every workload is already enforced by `test-crypto-bench` under the default
  # `test` job above; this job never inspects the numbers or fails on them, so a
  # noisy shared runner cannot make PR CI flaky (docs/CRYPTO_BENCHMARKS.md).
  crypto-bench:
    name: Crypto benchmark trend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        run: sh ./scripts/install-zig.sh 0.16.0

      - name: Cache Zig build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-crypto-bench-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-${{ github.sha }}
          restore-keys: |
            zig-crypto-bench-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-
            zig-crypto-bench-${{ runner.os }}-${{ runner.arch }}-

      - name: Run crypto benchmark suite
        run: |
          mkdir -p "$RUNNER_TEMP/crypto-bench-artifacts"
          zig build bench-crypto -Doptimize=ReleaseFast > "$RUNNER_TEMP/crypto-bench-artifacts/crypto-bench.json"

      - name: Upload crypto benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crypto-bench-results
          path: ${{ runner.temp }}/crypto-bench-artifacts/crypto-bench.json
          if-no-files-found: error
          retention-days: 14

  # ── Security scanning ─────────────────────────────────────────────────────────
  # Secret detection, filesystem vulnerability scanning, and GitHub Actions
  # hardening checks. Results are uploaded to the Security tab as SARIF.
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Secret scanning
        run: gitleaks detect --source . --config .gitleaks.toml --log-level warn

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: GitHub Actions hardening
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

  # ── Dependency review (PRs only) ──────────────────────────────────────────────
  # Flags new dependency additions or removals in pull requests.
  # Requires the Dependency Graph feature enabled under Settings → Security.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # External H3 resumption / 0-RTT interop
  # #522 assurance gate: build the pinned canonical external H3/QUIC peer,
  # point the live-process integration suite at it, and run the
  # general-profile H3 resumption/0-RTT cases on every PR. The peer's own
  # name/packages are confined to scripts/interop/ (the audited external-peer
  # boundary -- scripts/audit-dependencies.sh) and never appear in this file.
  h3-resumption-interop:
    name: H3 resumption/0-RTT interop
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        run: sh ./scripts/install-zig.sh 0.16.0

      - name: Cache Zig build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-h3-resumption-interop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-${{ github.sha }}
          restore-keys: |
            zig-h3-resumption-interop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-
            zig-h3-resumption-interop-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache external H3 peer build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tardigrade-h3-peer
          key: h3-peer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/interop/build-h3-peer-ci.sh') }}

      - name: Install external H3 peer build dependencies
        run: ./scripts/interop/install-h3-peer-deps-ci.sh

      - name: Build pinned external H3 peer
        id: build-h3-peer
        run: ./scripts/interop/build-h3-peer-ci.sh

      - name: Run H3 resumption/0-RTT interop suite
        env:
          H3_INTEROP_CLIENT_PATH: ${{ steps.build-h3-peer.outputs.client_path }}
        run: zig build test-integration-resumption-interop -Dtls-profile=general --summary all --error-style verbose

      - name: Run focused H3 HRR peer matrix
        env:
          H3_PEER_EXAMPLES_DIR: ${{ steps.build-h3-peer.outputs.examples_dir }}
        run: ./scripts/interop/run-h3-peer-ci.sh

  # Shared TLS-engine interoperability and conformance matrix
  # #338 (323-J): drives the one TLS 1.3 engine as both client and server, over
  # both the record and QUIC transports, across every supported
  # cipher-suite/group/signature tuple, against OpenSSL and GnuTLS as
  # independent out-of-process implementations -- plus the negative rows that
  # pin the RFC 8446 §6 failure class and the rows that make the engine select
  # among several credentials. The `ci` profile still runs *every* supported
  # tuple in both roles and on both transports; it reduces only the second
  # implementation's sweep. See docs/TLS_INTEROP_MATRIX.md.
  tls-conformance-matrix:
    name: TLS interop/conformance matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        run: sh ./scripts/install-zig.sh 0.16.0

      - name: Cache Zig build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-tls-conformance-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-${{ github.sha }}
          restore-keys: |
            zig-tls-conformance-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-
            zig-tls-conformance-${{ runner.os }}-${{ runner.arch }}-

      # The matrix drives two independent implementations as out-of-process
      # peers. Their package names live in scripts/interop/, the audited
      # external-peer boundary (scripts/audit-dependencies.sh), and must not
      # appear in this file.
      - name: Install external TLS peers
        run: ./scripts/interop/install-tls-peer-deps-ci.sh

      - name: Build the interop tools
        run: zig build build-tls-interop build-h3-interop --summary all --error-style verbose

      - name: Check the matrix vocabulary stays in step with the engine
        run: zig build test-tls-interop-matrix --summary all --error-style verbose

      - name: Run the conformance matrix (ci profile)
        env:
          TLS_INTEROP_WORKDIR: ${{ runner.temp }}/tls-interop
        run: ./scripts/interop/run-tls-interop.sh --profile ci

      # Transcripts are secret-free by construction (see the redaction contract
      # in docs/TLS_INTEROP_MATRIX.md), but the private keys generated for the
      # run are not, so only logs and transcripts are uploaded -- never the
      # `certs/` directory.
      - name: Upload failure transcripts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tls-interop-transcripts
          path: |
            ${{ runner.temp }}/tls-interop/logs
            ${{ runner.temp }}/tls-interop/transcripts
          retention-days: 7

  # ── Integration tests ─────────────────────────────────────────────────────────
  # Runs on push to main only (not PRs). Failures block the workflow.
  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: sudo apt-get install -y libssl-dev

      - name: Install Zig
        run: sh ./scripts/install-zig.sh 0.16.0

      - name: Cache Zig build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-integration-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-${{ github.sha }}
          restore-keys: |
            zig-integration-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig') }}-
            zig-integration-${{ runner.os }}-${{ runner.arch }}-

      - name: Print Zig version
        run: zig version

      - name: Run integration tests
        run: zig build test-integration --summary all
