name: Release Tardigrade

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # ── Prepare release ─────────────────────────────────────────────────────────
  # Skipped if triggered by workflow_run and CI did not succeed, ensuring
  # releases are never cut from a failing main.
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      release_sha: ${{ steps.meta.outputs.release_sha }}
      should_publish: ${{ steps.meta.outputs.should_publish }}

    steps:
      - name: Select release commit
        id: release_target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            release_sha="$WORKFLOW_RUN_SHA"
          else
            release_sha="$DISPATCH_SHA"
          fi
          test -n "$release_sha"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release_target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Determine release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          version="$(./scripts/release-metadata.sh version)"
          tag="$(./scripts/release-metadata.sh tag)"
          release_sha="$(git rev-parse HEAD)"
          should_publish="true"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [ "$tag_commit" != "$release_sha" ]; then
              should_publish="false"
            fi
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release_sha=$release_sha"
            echo "should_publish=$should_publish"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          mkdir -p "$RUNNER_TEMP/release-notes"
          ./scripts/release-metadata.sh notes > "$RUNNER_TEMP/release-notes/release-notes.md"

      - name: Upload release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes/release-notes.md
          if-no-files-found: error
          retention-days: 1

  build-release:
    name: Build ${{ matrix.archive_name }}
    needs: prepare-release
    if: needs.prepare-release.result == 'success' && needs.prepare-release.outputs.should_publish == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive_name: tardigrade-linux-x86_64
            deb_arch: amd64
            rpm_arch: x86_64
            linux_packages: true
            # Pin a portable glibc floor: a plain native build on this
            # runner links against symbols requiring the runner's full
            # glibc version, which is newer than what many still-supported
            # distros (e.g. Ubuntu 22.04 LTS glibc 2.35, RHEL9/Rocky9/Alma9
            # glibc 2.34) ship, so the published archive/DEB/RPM fail to
            # even start there. 2.28 matches the long-established
            # manylinux2014/RHEL8 portable-Linux-binary floor.
            zig_target: x86_64-linux-gnu.2.28
          - os: ubuntu-24.04-arm
            archive_name: tardigrade-linux-aarch64
            deb_arch: arm64
            rpm_arch: aarch64
            linux_packages: true
            zig_target: aarch64-linux-gnu.2.28
          - os: macos-15-intel
            archive_name: tardigrade-darwin-x86_64
            linux_packages: false
            zig_target: ""
          - os: macos-15
            archive_name: tardigrade-darwin-arm64
            linux_packages: false
            zig_target: ""

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          persist-credentials: false

      - name: Verify checkout is clean
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Install packaging prerequisites
        if: matrix.linux_packages == true
        run: sudo apt-get install -y rpm

      - name: Install Zig
        run: sh ./scripts/install-zig.sh 0.16.0

      - name: Print Zig version
        run: zig version

      - name: Prepare archive artifact paths
        id: archive_artifacts
        env:
          ARCHIVE_NAME: ${{ matrix.archive_name }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-artifacts/$ARCHIVE_NAME"
          mkdir -p "$artifact_dir"
          {
            echo "artifact_dir=$artifact_dir"
            echo "archive_path=$artifact_dir/$ARCHIVE_NAME.tar.gz"
            echo "sbom_path=$artifact_dir/sbom-$ARCHIVE_NAME.spdx.json"
            echo "inventory_path=$artifact_dir/dependency-inventory-$ARCHIVE_NAME.json"
          } >> "$GITHUB_OUTPUT"

      - name: Source and configuration audit
        if: matrix.linux_packages == true
        run: ./scripts/audit-dependencies.sh

      - name: Build native release binary
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          ZIG_TARGET: ${{ matrix.zig_target }}
        # -Dcpu=baseline: this is a native build (host arch == target arch),
        # which by default has Zig auto-detect and embed the exact CPU
        # features of this specific runner. A published release binary has
        # to run on whatever real hardware a user has -- not just this
        # runner's microarchitecture -- so pin the portable baseline
        # instruction set explicitly rather than inheriting whatever this
        # host happens to support.
        #
        # -Dtarget=<arch>-linux-gnu.2.28 (Linux only): a plain native build
        # also links against this runner's full glibc symbol versions,
        # which are newer than many still-supported distros ship (Ubuntu
        # 22.04 LTS, RHEL9/Rocky9/Alma9), so the published archive/DEB/RPM
        # fail to even start there. Pin the portable glibc floor explicitly;
        # matrix.zig_target is empty on Darwin, which has no equivalent
        # versioned-libc concern.
        run: |
          if [ -n "$ZIG_TARGET" ]; then
            zig build -Doptimize=ReleaseFast -Dcpu=baseline "-Dtarget=$ZIG_TARGET" "-Dversion=$VERSION"
          else
            zig build -Doptimize=ReleaseFast -Dcpu=baseline "-Dversion=$VERSION"
          fi

      - name: Verify macOS binary architecture
        if: runner.os == 'macOS'
        env:
          ARCHIVE_NAME: ${{ matrix.archive_name }}
        run: |
          set -euo pipefail
          case "$ARCHIVE_NAME" in
            tardigrade-darwin-x86_64) expected=x86_64 ;;
            tardigrade-darwin-arm64) expected=arm64 ;;
            *) echo "unexpected Darwin archive name: $ARCHIVE_NAME" >&2; exit 1 ;;
          esac
          test "$(uname -m)" = "$expected"
          file zig-out/bin/tardi | grep -F "$expected"

      - name: Audit native release binary linkage and record inventory
        env:
          INVENTORY_PATH: ${{ steps.archive_artifacts.outputs.inventory_path }}
        run: |
          ./scripts/audit-release-binary.sh \
            --binary zig-out/bin/tardi \
            --profile general \
            --output "$INVENTORY_PATH"

      - name: Package artifact
        env:
          ARCHIVE_NAME: ${{ matrix.archive_name }}
          ARTIFACT_DIR: ${{ steps.archive_artifacts.outputs.artifact_dir }}
        run: |
          ./scripts/package-release-archive.sh \
            --archive-name "$ARCHIVE_NAME" \
            --binary zig-out/bin/tardi \
            --staging-dir dist \
            --output-dir "$ARTIFACT_DIR"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ steps.archive_artifacts.outputs.artifact_dir }}
          artifact-name: sbom-${{ matrix.archive_name }}.spdx.json
          format: spdx-json
          output-file: ${{ steps.archive_artifacts.outputs.sbom_path }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive_artifacts.outputs.archive_path }}

      - name: Build DEB package
        if: matrix.linux_packages == true
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          ARTIFACT_DIR: ${{ steps.archive_artifacts.outputs.artifact_dir }}
        run: |
          ./packaging/deb/build.sh \
            --version "$VERSION" \
            --arch "$DEB_ARCH" \
            --binary zig-out/bin/tardi \
            --output "$ARTIFACT_DIR"

      - name: Build RPM package
        if: matrix.linux_packages == true
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          ARTIFACT_DIR: ${{ steps.archive_artifacts.outputs.artifact_dir }}
        run: |
          ./packaging/rpm/build.sh \
            --version "$VERSION" \
            --arch "$RPM_ARCH" \
            --binary zig-out/bin/tardi \
            --output "$ARTIFACT_DIR"

      - name: Verify native package metadata has no OpenSSL dependency
        if: matrix.linux_packages == true
        env:
          ARTIFACT_DIR: ${{ steps.archive_artifacts.outputs.artifact_dir }}
        run: |
          set -euo pipefail

          deb_path="$(find "$ARTIFACT_DIR" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          rpm_path="$(find "$ARTIFACT_DIR" -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$deb_path"
          test -n "$rpm_path"

          deb_requires="$(dpkg-deb -f "$deb_path" Depends 2>/dev/null || true)"
          if printf '%s\n' "$deb_requires" | grep -qiE 'libssl|libcrypto|openssl'; then
            echo "native DEB unexpectedly declares an OpenSSL dependency: $deb_requires" >&2
            exit 1
          fi

          rpm_requires="$(rpm -qp --requires "$rpm_path")"
          if printf '%s\n' "$rpm_requires" | grep -qiE 'libssl|libcrypto|openssl'; then
            echo "native RPM unexpectedly declares an OpenSSL dependency:" >&2
            printf '%s\n' "$rpm_requires" >&2
            exit 1
          fi

      - name: Upload archive artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ steps.archive_artifacts.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.archive_name }}
          path: ${{ steps.archive_artifacts.outputs.sbom_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload dependency inventory artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-inventory-${{ matrix.archive_name }}
          path: ${{ steps.archive_artifacts.outputs.inventory_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload DEB artifact
        if: matrix.linux_packages == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-${{ matrix.archive_name }}
          path: ${{ steps.archive_artifacts.outputs.artifact_dir }}/*.deb
          if-no-files-found: error
          retention-days: 1

      - name: Upload RPM artifact
        if: matrix.linux_packages == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpm-${{ matrix.archive_name }}
          path: ${{ steps.archive_artifacts.outputs.artifact_dir }}/*.rpm
          if-no-files-found: error
          retention-days: 1

  verify-linux-archive:
    name: Verify ${{ matrix.archive_name }} on ${{ matrix.distro }}
    needs:
      - prepare-release
      - build-release
    if: needs.prepare-release.result == 'success' && needs.prepare-release.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - archive_name: tardigrade-linux-x86_64
            distro: ubuntu:22.04
          - archive_name: tardigrade-linux-x86_64
            distro: rockylinux:9

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          persist-credentials: false

      - name: Download archive artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ runner.temp }}/verify-artifacts

      - name: Verify compatibility on ${{ matrix.distro }}
        env:
          ARCHIVE_NAME: ${{ matrix.archive_name }}
          DISTRO: ${{ matrix.distro }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          printf 'candidate_tag=%s\n' "$RELEASE_TAG"
          printf 'expected_version=%s\n' "$EXPECTED_VERSION"
          printf 'source_commit_sha=%s\n' "$RELEASE_SHA"
          ./scripts/verify-linux-compatibility.sh \
            "$DISTRO" \
            "$RUNNER_TEMP/verify-artifacts/$ARCHIVE_NAME.tar.gz" \
            "$EXPECTED_VERSION"

  publish-release:
    name: Publish GitHub release assets
    needs:
      - prepare-release
      - build-release
      - verify-linux-archive
    if: needs.prepare-release.result == 'success' && needs.prepare-release.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "$TAG")"
            test "$tag_commit" = "$RELEASE_SHA"
          else
            tag_object_sha="$(
              gh api --method POST \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GITHUB_REPOSITORY}/git/tags" \
                -f tag="$TAG" \
                -f message="Tardigrade $TAG" \
                -f object="$RELEASE_SHA" \
                -f type=commit \
                --jq .sha
            )"
            test -n "$tag_object_sha"
            gh api --method POST \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$tag_object_sha" >/dev/null
          fi

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/publish-release/release-notes

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/publish-release/dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        env:
          DIST_DIR: ${{ runner.temp }}/publish-release/dist
        run: |
          set -euo pipefail
          mkdir -p "$DIST_DIR"
          install -m 0755 scripts/install.sh "$DIST_DIR/install.sh"
          find "$DIST_DIR" -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name 'install.sh' \) -print0 | sort -z | xargs -0 sha256sum > "$DIST_DIR/tardigrade-checksums.txt"

      - name: Verify checksums
        env:
          CHECKSUMS_PATH: ${{ runner.temp }}/publish-release/dist/tardigrade-checksums.txt
        run: sha256sum --check "$CHECKSUMS_PATH"

      - name: Scan release archives for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/publish-release/dist/
          format: table
          severity: CRITICAL
          exit-code: 0

      - name: Publish release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: Tardigrade ${{ needs.prepare-release.outputs.tag }}
          body_path: ${{ runner.temp }}/publish-release/release-notes/release-notes.md
          files: |
            ${{ runner.temp }}/publish-release/dist/*.tar.gz
            ${{ runner.temp }}/publish-release/dist/*.deb
            ${{ runner.temp }}/publish-release/dist/*.rpm
            ${{ runner.temp }}/publish-release/dist/*.spdx.json
            ${{ runner.temp }}/publish-release/dist/dependency-inventory-*.json
            ${{ runner.temp }}/publish-release/dist/install.sh
            ${{ runner.temp }}/publish-release/dist/tardigrade-checksums.txt
          fail_on_unmatched_files: true
