# Example: External Authentication (forward_auth)
#
# Demonstrates: delegating the access decision for a location to an external
# auth service (oauth2-proxy, Authelia, or your own), the way NGINX
# `auth_request` or Caddy `forward_auth` do.
#
# What this config does:
#   - Listens on port 8080 (no TLS).
#   - Asks http://127.0.0.1:4180/verify about every /admin/ and /reports/
#     request before serving it. 2xx allows; 3xx/4xx is returned to the client.
#   - Copies X-Auth-Request-User from the auth response onto the upstream
#     request. A client-supplied X-Auth-Request-User is always dropped first.
#   - Fails closed with 503 if the auth service is down, and 504 on /reports/
#     if it takes longer than 500 ms.
#
# Minimal local setup (see README.md for the full walk-through):
#     python3 examples/forward-auth/auth.py &          # auth service on :4180
#     python3 -m http.server 3000 &                    # upstream app on :3000
#     TARDIGRADE_CONFIG_PATH=examples/forward-auth/tardigrade.conf ./zig-out/bin/tardi

listen 8080;
server_name localhost;

location = /health {
    return 200 ok;
}

# Protected application: auth identity is asserted to the upstream.
location /admin/ {
    forward_auth http://127.0.0.1:4180/verify;
    forward_auth_upstream_headers X-Auth-Request-User;
    forward_auth_client_headers Set-Cookie;
    proxy_pass http://127.0.0.1:3000/;
}

# Protected static files with a tighter auth deadline.
location /reports/ {
    forward_auth http://127.0.0.1:4180/verify;
    forward_auth_timeout_ms 500;
    forward_auth_failure_status 504;
    alias /tmp/tardigrade-reports/;
}
