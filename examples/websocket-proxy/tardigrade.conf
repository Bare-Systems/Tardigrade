# WebSocket relaying through proxy_pass (#812).
#
# Run with:
#   python3 examples/websocket-proxy/echo_server.py &
#   TARDIGRADE_CONFIG_PATH=examples/websocket-proxy/tardigrade.conf ./zig-out/bin/tardi
#   python3 examples/websocket-proxy/client.py ws://127.0.0.1:8080/ws/echo

listen 8080;

# Each open WebSocket holds a worker thread; the default cap is half of them.
worker_threads 8;
proxy_websocket_max_tunnels 4;

location = /healthz {
    return 200 ok;
}

# Plain WebSocket relay: /ws/echo reaches the origin as /echo.
location /ws/ {
    proxy_pass http://127.0.0.1:9000;
    proxy_websocket on;
    proxy_websocket_idle_timeout_ms 120000;
    proxy_set_header X-Via tardigrade-example;
}

# Browser-facing socket: only this page's origin may open it, and the
# connection is recycled hourly.
location /app-socket/ {
    proxy_pass http://127.0.0.1:9000/;
    proxy_websocket on;
    proxy_websocket_origins http://127.0.0.1:8080 http://localhost:8080;
    proxy_websocket_max_lifetime_ms 3600000;
}

# Everything else is ordinary HTTP. Without proxy_websocket, Upgrade is
# stripped and the origin is never asked to switch protocols.
location / {
    proxy_pass http://127.0.0.1:9000;
}
